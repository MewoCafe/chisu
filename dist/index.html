<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1eb">
<meta name="description" content="尺素：一张书案，笔墨纸砚，与故人共书。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="尺素">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png?v=3.0.8" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=3.0.8">
<title>尺素</title>
<link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin>
<link rel="stylesheet" href="css/base.css?v=3.0.8">
<link rel="stylesheet" href="css/scenes.css?v=3.0.8">
<link rel="stylesheet" href="css/views.css?v=3.0.8">
<link rel="stylesheet" href="css/book.css?v=3.0.8">
<link rel="stylesheet" href="css/fonts.css?v=3.0.8">
</head>
<body>
<div class="stage"><div id="app" class="app paper-tex">

<!-- 开场 -->
<section id="intro" class="intro paper-tex" aria-label="开场">
  <div class="book-frame intro-frame" aria-hidden="true"><i class="book-fishtail"></i></div>
  <div class="intro-rule top" aria-hidden="true"><div class="rule-wenwu"></div></div>
  <h1 class="intro-title"><span>尺</span><span>素</span></h1>
  <p class="intro-verse">见字如晤</p>
  <p class="intro-verse2">展信舒颜</p>
  <div class="intro-rule bottom" aria-hidden="true"><div class="rule-wenwu flip"></div></div>
  <div class="intro-seal-wrap"><button id="intro-enter" class="intro-seal" aria-label="启卷入案">启</button><small>轻触印章 · 启卷</small></div>
  <button id="intro-skip" class="intro-skip">略过</button>
  <div class="intro-foot"><span id="intro-date">丙午 · 秋</span><span class="latin">Chisu · a quiet desk</span></div>
</section>

<!-- 书案 -->
<section id="home" class="view desk active" aria-label="书案">
  <div class="book-frame desk-frame" aria-hidden="true"><i class="book-fishtail"></i></div>
  <header class="desk-head"><span class="name">尺素</span><small>一案清欢 · 一纸相知</small></header>
  <button class="tool tool-paper" id="tool-paper" aria-label="案上信笺，尺牍">
    <span class="paper-sheet">
      <span class="ed">尺素 · 尺牍集</span>
      <span class="hd">见字如晤</span>
      <span class="book-verse">欲尽此情书尺素</span>
      <span class="to" id="paper-to">致 君</span>
      <span class="seal" aria-hidden="true">素</span>
      <span class="hint">展笺阅信 <i aria-hidden="true">→</i></span>
    </span>
    <span class="paper-new" id="paper-new" hidden>新札</span>
  </button>
  <nav class="desk-index" aria-label="案上四事">
    <button class="tool tool-brush" id="tool-brush" aria-label="毛笔，共书">
      <svg class="book-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="m23 3 5 5-13 13-5-5zM10 16c-7 2-2 9-7 13 8-1 13-3 12-8M20 6l5 5"/></svg>
      <span class="tool-cap"><b>共书</b><small>执笔叙话</small></span><span class="index-num" aria-hidden="true">壹</span>
    </button>
    <button class="tool tool-lamp" id="tool-lamp" aria-label="案头灯，人物">
      <svg class="book-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15h22c-1 6-21 6-22 0ZM16 20v7M9 28h14M17 12c6-3-1-5 1-10-8 5-8 9-1 10Z"/></svg>
      <span class="tool-cap"><b>故人</b><small id="lamp-state">秉烛</small></span><span class="index-num" aria-hidden="true">贰</span>
    </button>
    <button class="tool tool-ink" id="tool-ink" aria-label="墨锭，墨藏">
      <svg class="book-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h16v24H8zM11 7h10v18H11zM14 12h4M14 16h4M14 20h4"/></svg>
      <span class="tool-cap"><b>墨藏</b><small>字卡入集</small></span><span class="index-num" aria-hidden="true">叁</span>
    </button>
    <button class="tool tool-stone" id="tool-stone" aria-label="砚台，案边事">
      <svg class="book-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4q8-3 16 0l2 23q-10 3-20 0ZM11 8q5-2 10 0l1 12H10zM11 24h10"/></svg>
      <span class="tool-cap"><b>案边</b><small>理案调墨</small></span><span class="index-num" aria-hidden="true">肆</span>
    </button>
  </nav>
  <footer class="desk-foot">
    <div class="rule-wenwu"></div>
    <div class="desk-foot-row">
      <button class="who-btn" id="desk-who" aria-label="更换共书之人"><img id="desk-who-img" alt=""><span>待君落笔</span><b id="desk-who-name">君</b></button>
      <span class="desk-time" id="desk-time">午正<i>壹</i></span>
    </div>
  </footer>
</section>

<!-- 共书 -->
<section id="chat" class="view folio" aria-label="共书">
  <header class="folio-head">
    <button class="link" data-home>收卷</button>
    <button class="chat-who" id="chat-who"><img id="chat-avatar" alt=""><span class="t"><b id="chat-name">君</b><small id="chat-status" role="status" aria-live="polite" aria-atomic="true">秉烛</small></span></button>
    <button class="seal-mini" id="call-btn" aria-label="传音"><span>传音</span></button>
  </header>
  <div class="rule-wenwu"></div>
  <div class="chat-paper"><span class="chat-running-head" aria-hidden="true">尺素 · 共书</span><div id="chat-stage" class="chat-stage" aria-live="polite"></div></div>
  <div class="folio-foot chat-pager"><button class="link" id="pg-prev">前叶</button><span class="pager-num" id="pg-num"></span><button class="link" id="pg-next">后叶</button></div>
  <div class="rule-wenwu flip"></div>
  <form class="composer" id="composer" autocomplete="off">
    <button type="button" class="composer-box" id="box-btn" aria-label="匣：颜、画、印">匣</button>
    <label class="sr-only" for="chat-input">提笔</label>
    <textarea id="chat-input" rows="1" maxlength="2000" placeholder="提笔……" enterkeyhint="send"></textarea>
    <button type="submit" class="seal-send" id="send-btn">落笔</button>
  </form>
  <div class="drawer" id="drawer">
    <nav class="tabs-v" id="drawer-tabs"><button class="tab-v on" data-lib="kao">颜</button><button class="tab-v" data-lib="img">画</button><button class="tab-v" data-lib="stk">印</button></nav>
    <div class="drawer-main"><div class="drawer-groups" id="drawer-groups"></div><div class="drawer-grid" id="drawer-grid"></div></div>
  </div>
</section>

<!-- 尺牍 -->
<section id="letters" class="view folio" aria-label="尺牍">
  <header class="folio-head">
    <button class="link" data-home>归案</button>
    <div class="folio-title"><h1>尺牍</h1><small id="letters-sub">与 君</small></div>
    <button class="link right" id="letter-write">修书</button>
  </header>
  <div class="rule-wenwu"></div>
  <div class="folio-body" id="letter-body"></div>
  <div class="folio-foot"><button class="link" id="lt-prev">前一封</button><span class="pager-num" id="lt-num"></span><button class="link" id="lt-next">后一封</button><span class="dot-sep">|</span><button class="link" id="lt-keep">藏</button></div>
</section>

<!-- 墨藏 -->
<section id="library" class="view folio" aria-label="墨藏">
  <header class="folio-head">
    <button class="link" data-home>归案</button>
    <div class="folio-title"><h1>墨藏</h1><small id="lib-sub">字笺</small></div>
    <button class="link right" id="lib-add">添</button>
  </header>
  <div class="rule-wenwu"></div>
  <div class="folio-body lib-body">
    <nav class="tabs-v" id="lib-tabs"><button class="tab-v on" data-lib="card">字笺</button><button class="tab-v" data-lib="kao">颜</button><button class="tab-v" data-lib="img">画</button><button class="tab-v" data-lib="stk">印</button></nav>
    <div class="lib-main">
      <div class="lib-groups" id="lib-groups"></div>
      <div class="lib-tools" id="lib-tools">
        <input class="field" id="lib-search" type="search" placeholder="寻……" aria-label="寻">
        <button class="link" id="lib-batch">批添</button><span class="dot-sep">·</span>
        <button class="link" id="lib-import">收</button><span class="dot-sep">·</span>
        <button class="link" id="lib-export">誊出</button><span class="dot-sep">·</span>
        <button class="link" id="lib-select">择</button>
      </div>
      <div class="lib-list" id="lib-list"></div>
    </div>
  </div>
  <div class="sel-bar" id="sel-bar" hidden><span id="sel-count">已择 〇</span><span><button class="link" id="sel-all">本叶尽择</button><span class="dot-sep">·</span><button class="link" id="sel-group">归组</button><span class="dot-sep">·</span><button class="link red" id="sel-del">弃</button><span class="dot-sep">·</span><button class="link" id="sel-done">罢</button></span></div>
  <div class="folio-foot"><button class="link" id="lib-prev">前叶</button><span class="pager-num" id="lib-num"></span><button class="link" id="lib-next">后叶</button></div>
</section>

<!-- 人物 -->
<section id="roles" class="view folio" aria-label="人物">
  <header class="folio-head">
    <button class="link" data-home>归案</button>
    <div class="folio-title"><h1>人物</h1><small>灯下 · 故人</small></div>
    <button class="link right" id="role-add">立</button>
  </header>
  <div class="rule-wenwu"></div>
  <div class="folio-body"><div class="role-list" id="role-list"></div></div>
  <div class="folio-foot"><button class="link" id="role-prev">前叶</button><span class="pager-num" id="role-num"></span><button class="link" id="role-next">后叶</button></div>
</section>

<!-- 案边事 -->
<section id="settings" class="view folio" aria-label="案边事">
  <header class="folio-head">
    <button class="link" data-home>归案</button>
    <div class="folio-title"><h1>案边事</h1><small>砚 边 小 设</small></div>
    <span style="width:44px"></span>
  </header>
  <div class="rule-wenwu"></div>
  <div class="folio-body ed-body">
    <nav class="tabs-v" id="set-tabs"><button class="tab-v on" data-sec="self">自署</button><button class="tab-v" data-sec="lamp">守灯</button><button class="tab-v" data-sec="post">信使</button><button class="tab-v" data-sec="look">观感</button><button class="tab-v" data-sec="file">卷宗</button></nav>
    <div class="ed-pane" id="set-pane"></div>
  </div>
</section>

<!-- 传音 -->
<div id="call" class="call" role="dialog" aria-label="传音">
  <div class="call-mist" aria-hidden="true"></div>
  <div class="call-top"><span>传音</span><small id="call-state">遣信使相召……</small><div class="rule-wenwu"></div></div>
  <div class="call-lamp"><i class="glow" aria-hidden="true"></i><img id="call-avatar" alt=""></div>
  <h2 class="call-name" id="call-name">君</h2>
  <div class="call-time" id="call-time"></div>
  <svg class="call-wave" viewBox="0 0 300 44" preserveAspectRatio="none" aria-hidden="true"><path id="wave-a" d="M0 22H300"/><path id="wave-b" class="thin" d="M0 22H300"/></svg>
  <div class="call-sub" id="call-sub" aria-live="polite"></div>
  <form class="call-input" id="call-input" hidden><input id="call-text" maxlength="200" placeholder="欲言……" autocomplete="off"><button type="submit">言毕</button></form>
  <div class="call-ctrl" id="call-ctrl"></div>
</div>

<!-- 悬浮信笺 -->
<button id="float-note" class="float-note" aria-label="新来信笺"><span class="fn-seal">札</span><span class="fn-name" id="fn-name"></span><span class="fn-text" id="fn-text"></span></button>

</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><div class="nomodule-note">尺素需开启脚本方可展卷。</div></noscript>
<script>
/* 旧内核探测：不支持 ES2017 async 函数时，提示换器具，免得白屏。 */
(function(){try{new Function('async function f(){await 0}; var a=(x)=>x; let b=`t`;');window.__chisuOK=true}catch(e){document.write('<div class="nomodule-note">此器太旧，尺素展不开。<br>请改用较新的浏览器（Chrome / 夸克 / Via 皆可）。</div>')}})();
</script>
<script src="js/core.js?v=3.0.8"></script>
<script src="js/util.js?v=3.0.8"></script>
<script src="js/state.js?v=3.0.8"></script>
<script src="js/engine.js?v=3.0.8"></script>
<script src="js/ink.js?v=3.0.8"></script>
<script src="js/desk.js?v=3.0.8"></script>
<script src="js/chat.js?v=3.0.8"></script>
<script src="js/call.js?v=3.0.8"></script>
<script src="js/letters.js?v=3.0.8"></script>
<script src="js/library.js?v=3.0.8"></script>
<script src="js/roles.js?v=3.0.8"></script>
<script src="js/keepalive.js?v=3.0.8"></script>
<script src="js/settings.js?v=3.0.8"></script>
<script src="js/app.js?v=3.0.8"></script>
</body>
</html>
